version: '3.8'

services:
  scylladb:
    image: scylladb/scylla:5.4
    container_name: rakshak-scylladb
    restart: unless-stopped
    ports:
      - "9042:9042" # CQL native transport port
      - "10000:10000" # REST API management
    command: --smp 1 --memory 1G --developer-mode 1
    volumes:
      - scylla-data:/var/lib/scylla
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES;'"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  scylla-data:
